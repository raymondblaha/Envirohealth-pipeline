name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: envirohealth
          POSTGRES_USER: envirohealth
          POSTGRES_PASSWORD: envirohealth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U envirohealth -d envirohealth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: envirohealth
      DB_USER: envirohealth
      DB_PASSWORD: envirohealth
      RUN_DB_TESTS: "1"
      LOKY_MAX_CPU_COUNT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Docker build
        run: docker compose build app

